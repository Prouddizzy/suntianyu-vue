name: Build frontend image

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional image tag. Defaults to sha-<short-commit>.
        required: false
        default: ""
      api_base_url:
        description: Frontend API base URL baked into the production bundle.
        required: false
        default: /api/v1
      use_mock_api:
        description: Build the frontend with mock API mode enabled.
        required: false
        type: boolean
        default: false
      push_to_ghcr:
        description: Push the built image to GitHub Container Registry.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve build metadata
        id: meta
        shell: bash
        run: |
          OWNER_LOWER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          TAG_INPUT=""
          API_BASE_INPUT="${{ vars.VUE_APP_API_BASE_URL }}"
          MOCK_API_INPUT="${{ vars.VUE_APP_USE_MOCK_API }}"
          PUSH_TO_GHCR="false"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG_INPUT="${{ inputs.image_tag }}"
            API_BASE_INPUT="${{ inputs.api_base_url }}"
            MOCK_API_INPUT="${{ inputs.use_mock_api }}"
            if [ "${{ inputs.push_to_ghcr }}" = "true" ]; then
              PUSH_TO_GHCR="true"
            fi
          elif [ "${GITHUB_REF}" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            PUSH_TO_GHCR="true"
          fi

          if [ -z "$TAG_INPUT" ]; then
            TAG="sha-${GITHUB_SHA::7}"
          else
            TAG="$TAG_INPUT"
          fi
          if [ -z "$API_BASE_INPUT" ]; then
            API_BASE="/api/v1"
          else
            API_BASE="$API_BASE_INPUT"
          fi
          if [ -z "$MOCK_API_INPUT" ]; then
            MOCK_API="false"
          else
            MOCK_API="$MOCK_API_INPUT"
          fi

          REF_SLUG="$(echo "${GITHUB_REF_NAME}" | tr '/[:upper:]' '-[:lower:]')"
          IMAGE_NAME="ghcr.io/${OWNER_LOWER}/stm32-smart-disinfector-vue"

          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "api_base=$API_BASE" >> "$GITHUB_OUTPUT"
          echo "mock_api=$MOCK_API" >> "$GITHUB_OUTPUT"
          echo "ref_slug=$REF_SLUG" >> "$GITHUB_OUTPUT"
          echo "push_to_ghcr=$PUSH_TO_GHCR" >> "$GITHUB_OUTPUT"
          echo "archive=stm32-smart-disinfector-vue-${TAG}.tar" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image archive
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            VUE_APP_API_BASE_URL=${{ steps.meta.outputs.api_base }}
            VUE_APP_USE_MOCK_API=${{ steps.meta.outputs.mock_api }}
          outputs: type=docker,dest=/tmp/${{ steps.meta.outputs.archive }}
          provenance: false
          tags: |
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.ref_slug }}
            ${{ steps.meta.outputs.image_name }}:latest

      - name: Load image into Docker
        run: docker load --input /tmp/${{ steps.meta.outputs.archive }}

      - name: Log in to GHCR
        if: ${{ steps.meta.outputs.push_to_ghcr == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push versioned image to GHCR
        if: ${{ steps.meta.outputs.push_to_ghcr == 'true' }}
        run: |
          docker push "${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.tag }}"
          docker push "${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.ref_slug }}"

      - name: Push latest image to GHCR
        if: ${{ steps.meta.outputs.push_to_ghcr == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: docker push "${{ steps.meta.outputs.image_name }}:latest"

      - name: Compress image archive
        run: gzip -f /tmp/${{ steps.meta.outputs.archive }}

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image-${{ steps.meta.outputs.tag }}
          path: /tmp/${{ steps.meta.outputs.archive }}.gz
          if-no-files-found: error
